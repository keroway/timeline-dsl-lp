# pnpm 11 では overrides / patchedDependencies は pnpm-workspace.yaml に置く
# (package.json#pnpm からの移動)。

# サプライチェーン保護水準をワークスペース全体で統一 (agent-assets#171、2026-08-14決定)。
# pnpm 11 既定の minimumReleaseAge (1440分=1日) を 3日 (4320分) に固定し、
# 制約を満たすバージョンが無いときに resolve を失敗させる minimumReleaseAgeStrict も有効化する。
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

overrides:
  esbuild: 0.28.1
  fast-uri: 3.1.6
  js-yaml: 4.3.1
  tmp: 0.2.7
  undici: 7.29.0
  uuid: 11.1.1
  yaml: 2.8.4
  # osv-scanner で検出した脆弱性のパッチレベル修正（GHSA-r28c-9q8g-f849 / GHSA-v422-hmwv-36x6）。
  # いずれも破壊的変更なし
  postcss: 8.5.25
  body-parser: 1.20.6
  # osv-scanner 検出分（2026-08-09、#573）。いずれも devDependency 経由でビルド成果物には載らない。
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 (brace-expansion ReDoS)
  #   — @lhci/cli > chrome-launcher > rimraf > glob > minimatch 経由。
  brace-expansion: 1.1.18
  # GHSA-22jq-vg5j-6vgg / GHSA-4xrf-jv44-h6hh / GHSA-mwp4-54f8-5fhr (ip-address)
  #   — @lhci/cli / lighthouse > puppeteer-core > proxy-agent > socks 経由。
  ip-address: 10.3.1
  # GHSA-2v37-7h3g-55p8 (nanoid <3.3.17) — size=0 で customAlphabet / customRandom が
  #   無限ループする。postcss（ソースマップ用 ID 生成、size は固定）経由。
  nanoid: 3.3.18
  # osv-scanner 検出分（2026-09-05、#629）。
  # GHSA-w9m9-85wc-3x92 (postcss-selector-parser ReDoS) — Tailwind/PostCSS 経由。
  postcss-selector-parser: 6.1.3
  # GHSA-4mjr-xmp4-gh2g (qs 前方参照 DoS) — Astro/依存パッケージ経由。
  qs: 6.16.0

patchedDependencies:
  "@lhci/utils@0.15.1": patches/@lhci__utils@0.15.1.patch
  undici@7.29.0: patches/undici@7.29.0.patch

# pnpm 11 のセキュリティ寄りデフォルト (minimumReleaseAge=1440 / strictDepBuilds /
# blockExoticSubdeps) は既定値のまま使う。
# 参考: https://pnpm.io/blog/2025/12/29/pnpm-in-2025

# 緊急修正等で cooldown (minimumReleaseAge) を待たずに導入したい
# パッケージはここで例外指定する。
minimumReleaseAgeExclude: []

# pnpm 11 はデフォルトで依存の build スクリプト実行を遮断する (strictDepBuilds)。
# 実行を許可するものだけ allowBuilds で明示する。
allowBuilds:
  # Astro 6 が画像最適化に使うネイティブビルド依存。
  # node-gyp の install スクリプトでプラットフォーム別バイナリを取得する。
  sharp: true
  # Astro / Vite が内部で使うバンドラ。
  # install スクリプトでプラットフォーム別バイナリの解決を検証する。
  esbuild: true
  # git pre-commit フックを .git/hooks/ にインストールする。
  # postinstall で自動設定するが、prepare スクリプト (lefthook install) でも手動再実行できる。
  lefthook: true

# git:/http: など標準レジストリ以外を経由した間接依存をブロックする。
blockExoticSubdeps: true

# provenance (公開方法の信頼レベル) が下がる更新を拒否する。
trustPolicy: no-downgrade

# trustPolicy の例外。ここに挙げた package@version だけ no-downgrade 判定を免除する。
# 同一パッケージ名は 1 エントリにまとめ、複数版は `||` で並べる (別行に分けると先頭しか効かない)。
# semver: lighthouse (@lhci/cli の依存, dev 専用) が古い 5.x / 6.x を間接利用する。
#   いずれも 2023 年以前の公開で provenance attestation を持たないため downgrade 判定されるが、
#   semver はエコシステム標準の versioning ライブラリで実害はない。本番バンドルには含まれない。
# chokidar@4.0.3: astro が依存するファイル監視ライブラリ。4.0.2/4.0.3 で provenance
#   attestation が付かなくなった (メンテナ側の publish パイプライン変更によるものと見られ、
#   実際の侵害の証拠は無い)。同時期に shadcn-vue / react-router / c12 等の他プロジェクトでも
#   同じ downgrade 検知が報告されている (pnpm/pnpm#10622)。chokidar が v5 で provenance を
#   再度付けるようになったら、この行を削除して trustPolicy を機能させる。
trustPolicyExclude:
  - "semver@5.7.2 || 6.3.1"
  - "chokidar@4.0.3"
