name: Sync repo stats

# 本体リポジトリ (keroway/timeline-dsl) の stars / license / contributors を週次で取得し、
# repo-stats.generated.json に差分があれば更新 PR を自動作成する。
on:
  schedule:
    - cron: "0 0 * * 1" # 月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # site-build.yml を workflow_dispatch でトリガーするため

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # secrets context は if: では参照できないため env 経由で渡す (#544)
      HAS_RELEASE_SYNC_PAT: ${{ secrets.RELEASE_SYNC_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      # fetch-github-repo-stats.mjs は node 組み込みモジュールのみ使うため pnpm install 不要
      - name: Fetch repo stats
        run: node site/scripts/fetch-github-repo-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # fetchedAt は実行のたびに更新されるため、内容に差分がない場合は
      # 変更を巻き戻して PR 作成をスキップする (idempotent)
      - name: Revert timestamp-only changes
        run: |
          file=site/src/data/repo-stats.generated.json
          if git diff --quiet -- "$file"; then
            echo "No changes."
            exit 0
          fi
          git show "HEAD:$file" | jq 'del(.fetchedAt)' > /tmp/repo-stats-old.json
          jq 'del(.fetchedAt)' "$file" > /tmp/repo-stats-new.json
          if cmp -s /tmp/repo-stats-old.json /tmp/repo-stats-new.json; then
            echo "Only fetchedAt changed. Reverting."
            git checkout -- "$file"
          else
            echo "Repo stats content changed."
          fi

      # RELEASE_SYNC_PAT (fine-grained PAT, contents:write + pull-requests:write) が
      # secrets に登録されていればそれを使う。PR が PAT で push されると通常の pull_request
      # イベントとして発火し、required check "build" が自動実行される (#544)。
      # 未登録の間は従来通り GITHUB_TOKEN にフォールバックする。
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_SYNC_PAT || secrets.GITHUB_TOKEN }}
          branch: chore/sync-repo-stats
          delete-branch: true
          commit-message: "chore(data): repo-stats.generated.json を最新の stars/license/contributors に同期する"
          title: "chore(data): repo-stats.generated.json を最新の stars/license/contributors に同期する"
          body: |
            `sync-repo-stats.yml` の週次実行による自動更新です。

            - `node site/scripts/fetch-github-repo-stats.mjs` を実行し、本体リポジトリの stars / license / contributors 数を `site/src/data/repo-stats.generated.json` に反映しました。
            - マージ前に ja / en の LP で数値が表示されることを Cloudflare Pages の preview デプロイで確認してください。

      # GITHUB_TOKEN で push された PR は pull_request イベントを発火しない (無限ループ防止のため)。
      # RELEASE_SYNC_PAT 未登録時のみ、workflow_dispatch で required check "build" を明示的に起動するフォールバック。
      # RELEASE_SYNC_PAT 登録後は pull_request イベントが正常に発火するため本ステップは実行されない (#544)。
      - name: "Trigger site build on the PR branch (GITHUB_TOKEN フォールバック)"
        if: (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated') && env.HAS_RELEASE_SYNC_PAT != 'true'
        run: gh workflow run site-build.yml --ref "${{ steps.cpr.outputs.pull-request-branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
